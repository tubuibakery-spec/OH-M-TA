# Cấu hình Supabase CLI cho OH! MÊ TA
# Tài liệu: https://supabase.com/docs/guides/local-development/cli/config

project_id = "oh-me-ta"

[api]
enabled = true
port = 54321
schemas = ["public"]
# ⚠️ KHÔNG thêm "bao_mat" vào đây. Các hàm phân quyền nằm trong schema đó
# và không được phơi ra thành RPC công khai.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

# Tài khoản do quản trị viên cấp — không cho tự đăng ký.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
